name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the build
        type: choice
        options:
          - ubuntu-latest
          - adler-ephemeral
        default: ubuntu-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-source:
    name: Package source
    runs-on: >-
      ${{ inputs.runner == 'adler-ephemeral'
          && fromJSON('["self-hosted", "linux", "x64"]')
          || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build source archive and checksums
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="HomeFrigateOllamaIaC-${tag}/" \
            -o "dist/HomeFrigateOllamaIaC-${tag}.tar.gz" \
            HEAD
          (cd dist && sha256sum ./* > checksums.txt)
      - name: Attest source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload source archive
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: dist/
          retention-days: 7
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
