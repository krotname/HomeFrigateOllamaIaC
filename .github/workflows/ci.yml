name: CI

on:
  push:
    branches:
      - main
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  iac-validation:
    name: IaC validation
    # Home runners execute only owner-authored, same-repository PRs or owner pushes to main.
    if: >-
      github.repository == 'krotname/HomeFrigateOllamaIaC'
      && github.actor == github.repository_owner
      && ((github.event_name == 'pull_request'
           && github.event.pull_request.user.login == github.repository_owner
           && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: arc-prod-adler-home-frigate
    timeout-minutes: 15
    env:
      ANSIBLE_CONFIG: ansible.cfg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: ${{ startsWith(runner.name, 'arc-prod-adler-') }}
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/ci.yml --job "$GITHUB_JOB"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ${{ !startsWith(runner.name, 'arc-prod-adler-') && 'pip' || '' }}
          cache-dependency-path: requirements-dev.lock
      - name: Install IaC tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Lint YAML
        run: python -m yamllint .github ansible .yamllint.yml
      - name: Lint Ansible
        run: ansible-lint ansible/playbooks/site.yml
      - name: Check Ansible syntax
        run: >-
          ansible-playbook
          -i ansible/inventory.example.yml
          ansible/playbooks/site.yml
          --syntax-check
          -e @ansible/group_vars/all.example.yml
      - name: Run dependency-free Python tests
        run: |
          python -m compileall -q asr ocr ollama-audio-transcription tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate ASR Compose model
        # config only parses the model; it does not need a Docker daemon.
        run: docker compose -f asr/docker-compose.yml config --quiet
      - name: Validate Black media Compose models
        run: |
          docker compose -f asr/docker-compose.black.yml config --quiet
          docker compose -f asr/docker-compose.black.cpu.yml config --quiet
          docker compose -f ocr/docker-compose.black.yml config --quiet
          docker compose -f ocr/docker-compose.black.cpu.yml config --quiet

  powershell-validation:
    name: PowerShell validation
    if: >-
      github.repository == 'krotname/HomeFrigateOllamaIaC'
      && github.actor == github.repository_owner
      && ((github.event_name == 'pull_request'
           && github.event.pull_request.user.login == github.repository_owner
           && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: arc-prod-adler-home-frigate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: ${{ startsWith(runner.name, 'arc-prod-adler-') }}
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/ci.yml --job "$GITHUB_JOB"
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts, tests -Filter *.ps1 -Recurse | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              if ($parseErrors) {
                  $errors += $parseErrors | ForEach-Object {
                      "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
                  }
              }
          }
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
          }
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $findings = @()
          $findings += Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $findings += Invoke-ScriptAnalyzer -Path tests -Recurse -Severity Error
          if ($findings) {
              $findings | Format-Table -AutoSize
              exit 1
          }

  powershell-tests:
    name: PowerShell tests
    if: >-
      github.repository == 'krotname/HomeFrigateOllamaIaC'
      && github.actor == github.repository_owner
      && ((github.event_name == 'pull_request'
           && github.event.pull_request.user.login == github.repository_owner
           && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: arc-prod-adler-home-frigate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: ${{ startsWith(runner.name, 'arc-prod-adler-') }}
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/ci.yml --job "$GITHUB_JOB"
      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Run PowerShell tests
        shell: pwsh
        run: Invoke-Pester -Path tests -CI

  secret-hygiene:
    name: Secret hygiene
    if: >-
      github.repository == 'krotname/HomeFrigateOllamaIaC'
      && github.actor == github.repository_owner
      && ((github.event_name == 'pull_request'
           && github.event.pull_request.user.login == github.repository_owner
           && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: arc-prod-adler-home-frigate
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: ${{ startsWith(runner.name, 'arc-prod-adler-') }}
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/ci.yml --job "$GITHUB_JOB"
      - name: Check for obvious committed secrets
        run: |
          credential_terms='api[_-]?key|token|secret|password|private[_-]?key'
          shapes='ghp_|gho_|sk-|-----BEGIN|[A-Za-z0-9/+_=.-]{32,}'
          pattern="(${credential_terms}).*(=|:).*(${shapes})"
          if git grep -n --ignore-case -E "$pattern" -- . ':!SECURITY.md'; then
            echo "Potential committed secret detected"
            exit 1
          fi
