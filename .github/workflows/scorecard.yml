name: Scorecards

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  scorecard:
    name: OSSF Scorecards
    if: >-
      github.repository == 'krotname/HomeFrigateOllamaIaC'
      && ((github.event_name == 'pull_request'
           && github.actor == github.repository_owner
           && github.event.pull_request.user.login == github.repository_owner
           && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.ref == 'refs/heads/main'
              && (github.event_name == 'schedule' || github.actor == github.repository_owner)))
    runs-on: arc-prod-adler-home-frigate
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: ${{ startsWith(runner.name, 'arc-prod-adler-') }}
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/scorecard.yml --job "$GITHUB_JOB"
      - name: Install Scorecard CLI
        env:
          SCORECARD_VERSION: "5.5.0"
          SCORECARD_SHA256: "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff"
        run: |
          set -euo pipefail
          archive="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/${archive}"
          echo "${SCORECARD_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/scorecard"
          tar -xzf "${archive}" -C "$RUNNER_TEMP/scorecard" scorecard
          chmod 0755 "$RUNNER_TEMP/scorecard/scorecard"
      - name: Analyze
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/scorecard/scorecard" \
            --repo="github.com/${{ github.repository }}" \
            --commit="${GITHUB_SHA}" \
            --format=json \
            --output="scorecard-results.json" \
            --show-details
      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard
          path: scorecard-results.json
          if-no-files-found: error
          retention-days: 7
