services:
  frigate-caption:
    container_name: frigate-caption
    image: ${OCR_API_IMAGE:-home-ocr:local}
    restart: unless-stopped
    network_mode: host
    entrypoint: ["python", "/app/frigate_caption_worker.py"]
    environment:
      FRIGATE_CAPTION_STATE_DIR: /state
      FRIGATE_CAPTION_PRIORITY_URL: http://192.168.1.242:8000/slots
      FRIGATE_CAPTION_PRIORITY_KEY_FILE: /run/secrets/llm-key
      FRIGATE_CAPTION_ASR_HEALTH_URL: https://127.0.0.1:19443/health
    volumes:
      - /var/lib/frigate-caption:/state
      - /etc/black-qwen/api-key:/run/secrets/llm-key:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m]
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
