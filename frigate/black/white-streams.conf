# Included at the nginx main level, outside http {}.
stream {
    server {
        listen 8554;
        proxy_pass 192.168.1.242:8554;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
    server {
        listen 8555;
        proxy_pass 192.168.1.242:8555;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
    server {
        listen 8555 udp;
        proxy_pass 192.168.1.242:8555;
        proxy_timeout 60s;
    }
}

