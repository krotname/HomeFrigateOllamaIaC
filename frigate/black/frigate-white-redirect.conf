# Retired Frigate names must not select the canonical default vhost.
server {
    listen 443 ssl;
    listen 8971 ssl;
    server_name adler-frigate.lan frigate.adler-white-w1.lan frigate.lan
                adler-frigate.local frigate.local adler-frigate frigate-ubuntu;
    ssl_reject_handshake on;
    return 421;
}
