server {
    listen 443 ssl;
    server_name frigate.adler-white-w1.lan;

    ssl_certificate /opt/frigate/certs/white-domain-fullchain.pem;
    ssl_certificate_key /opt/frigate/certs/white-domain-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://frigate.adler-black-u2.lan$request_uri;
}
