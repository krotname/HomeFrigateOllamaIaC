server {
    listen 443 ssl;
    server_name frigate.adler-black-u2.lan;

    ssl_certificate /opt/frigate/certs/black-domain-fullchain.pem;
    ssl_certificate_key /opt/frigate/certs/black-domain-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Home AI";
    auth_basic_user_file /etc/nginx/.htpasswd-home-ai;
    client_max_body_size 50m;

    location = / {
        return 302 /review;
    }

    location / {
        proxy_pass https://192.168.1.242:18971;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $home_ai_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
